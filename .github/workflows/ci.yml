name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[validation]'

      - name: Check source formatting and imports
        run: |
          python -m isort --check-only src test
          python -m black --check src test
          python -m ruff check src test

      - name: Check notebook formatting and imports
        run: |
          python -m nbqa isort --check examples/*.ipynb
          python -m black --check --ipynb examples/*.ipynb
          python -m nbqa ruff examples/*.ipynb

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[validation]'

      - name: Run unit tests
        run: python -m pytest test

  notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[validation]'

      - name: Run notebooks with pytest
        run: python -m pytest examples

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel smoke test
        run: |
          python -m pip install "$(ls -t dist/*.whl | head -n 1)"
          python -c "import rxmc; import rxmc.config; import rxmc.walker"
