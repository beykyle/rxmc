[build-system]
requires = ["setuptools>=62.0.0", "setuptools_scm[toml]>=6.2",]
build-backend = "setuptools.build_meta"

[project]
name = "rxmc"
authors = [
  {name="Kyle Beyer", email="beyerk@frib.msu.edu"}
]
description = "Uncertainty quantification and calibration of reaction models with Markov-Chain Monte Carlo, with flexible and composable models for the likelihood and corpus of constraints"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dynamic = ["dependencies", "version"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
keywords = ["bayesian inference", "mcmc", "uncertainty quantification", "nuclear physics", "calibration"]

[project.urls]
Homepage = "https://github.com/beykyle/rxmc"
Repository = "https://github.com/beykyle/rxmc"
Issues = "https://github.com/beykyle/rxmc/issues"

[project.optional-dependencies]
examples = [
  "corner>=2.2",
  "ipykernel>=6.0",
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "tqdm>=4.66",
]
validation = [
  "black>=24.0",
  "build>=1.2",
  "corner>=2.2",
  "ipykernel>=6.0",
  "isort>=5.13",
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "nbmake>=1.5",
  "nbqa>=1.9",
  "pytest>=8.0",
  "ruff>=0.6",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
write_to = "src/rxmc/__version__.py"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "test"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I"]

[tool.pytest.ini_options]
addopts = "--nbmake --nbmake-timeout=1200"
testpaths = ["test", "examples"]
